# Entorno de laboratorio de RepMatch — TP Inicial.
#
# Levanta los nodos del diagrama de despliegue: la base de datos, los hosts del componente de
# catalogo (REST y SOAP), el de IA y la aplicacion web. La Web arranca en modo Soap: busca los
# repuestos por SOAP y las opciones de vehiculo y el diagnostico por REST, asi cada busqueda usa
# los dos protocolos de integracion que pide la consigna.
#
#   docker compose up --build --wait     -> espera a que todos esten sanos
#     Web       http://localhost:8080
#     Catalogo  http://localhost:8081/salud
#     SOAP      http://localhost:8082/ConsultaCompatibilidad.svc?wsdl   (Segunda Parte: WSDL)
#     IA        http://localhost:8083/salud   (Segunda Parte: diagnostico por texto libre)
#
#   docker compose --profile test run --rm tests        -> corre las pruebas
#   docker compose --profile local up --build web-local -> la misma Web en modo Local
#
# Los precios salen de las tiendas reales (easy.com.ar y fravega.com, API publica de VTEX).
# scripts/e2e.sh las cambia por el simulador (perfil "simulacion") con OFERTAS_URL_EASY y
# OFERTAS_URL_FRAVEGA, para que las pruebas no dependan de precios que cambian todos los dias.
#
# Los puertos del host se pueden cambiar con un archivo .env (ver .env.example) para
# evitar choques con lo que cada uno tenga corriendo.

x-conexion-postgres: &conexion-postgres
  Persistencia__Proveedor: Postgres
  ConnectionStrings__RepMatch: "Host=postgres;Port=5432;Database=repmatch;Username=repmatch;Password=repmatch"

# Proveedor del LLM. La clave sale del .env (que no se commitea); sin clave, cada servicio que
# diagnostica usa el clasificador local y el entorno levanta igual.
x-llm: &llm
  IA__Llm__ApiKey: "${IA_LLM_APIKEY:-}"
  IA__Llm__UrlBase: "${IA_LLM_URLBASE:-https://api.groq.com/openai/v1/}"
  IA__Llm__Modelo: "${IA_LLM_MODELO:-llama-3.3-70b-versatile}"

# Tiendas donde buscar precios. Por defecto las reales; las pruebas las apuntan al simulador.
x-tiendas: &tiendas
  Ofertas__Tiendas__0__UrlBase: "${OFERTAS_URL_EASY:-https://www.easy.com.ar}"
  Ofertas__Tiendas__0__CacheMinutos: "${OFERTAS_CACHE_MINUTOS:-10}"
  Ofertas__Tiendas__1__UrlBase: "${OFERTAS_URL_FRAVEGA:-https://www.fravega.com}"
  Ofertas__Tiendas__1__CacheMinutos: "${OFERTAS_CACHE_MINUTOS:-10}"

services:
  postgres:
    image: postgres:17-alpine
    container_name: repmatch-postgres
    environment:
      POSTGRES_DB: repmatch
      POSTGRES_USER: repmatch
      POSTGRES_PASSWORD: repmatch
    ports:
      - "${PUERTO_POSTGRES:-5432}:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      # Los servicios .NET esperan a que la base acepte conexiones de verdad,
      # no solo a que el contenedor exista.
      test: ["CMD-SHELL", "pg_isready -U repmatch -d repmatch"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [repmatch]

  catalogo-api:
    build:
      context: .
      dockerfile: src/RepMatch.Catalogo.Api/Dockerfile
    image: repmatch/catalogo-api:tp-inicial
    container_name: repmatch-catalogo-api
    environment:
      <<: [*conexion-postgres, *llm]
      # Development habilita /openapi/v1.json, que es parte del entregable.
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "${PUERTO_CATALOGO:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [repmatch]

  # Componente de catalogo expuesto por SOAP (Segunda Parte). Misma base y misma logica que
  # catalogo-api; publica el WSDL en /ConsultaCompatibilidad.svc?wsdl.
  catalogo-soap:
    build:
      context: .
      dockerfile: src/RepMatch.Catalogo.Soap/Dockerfile
    image: repmatch/catalogo-soap:segunda
    container_name: repmatch-catalogo-soap
    environment:
      <<: *conexion-postgres
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "${PUERTO_CATALOGO_SOAP:-8082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [repmatch]

  # Componente de IA expuesto por REST. No tiene base: recibe los candidatos en la peticion.
  ia-api:
    build:
      context: .
      dockerfile: src/RepMatch.IA.Api/Dockerfile
    image: repmatch/ia-api:segunda
    container_name: repmatch-ia-api
    environment:
      <<: *llm
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "${PUERTO_IA:-8083}:8080"
    networks: [repmatch]

  web:
    build:
      context: .
      dockerfile: src/RepMatch.Web/Dockerfile
    image: repmatch/web:tp-inicial
    container_name: repmatch-web
    environment:
      <<: [*conexion-postgres, *tiendas]
      ASPNETCORE_ENVIRONMENT: Development
      # Repuestos por SOAP contra catalogo-soap; opciones de vehiculo por REST contra
      # catalogo-api. Catalogo__Modo=Remoto o Local cambian el camino sin recompilar.
      Catalogo__Modo: Soap
      Catalogo__UrlSoap: "http://catalogo-soap:8080/ConsultaCompatibilidad.svc"
      Catalogo__UrlBaseRemota: "http://catalogo-api:8080"
      # La IA tambien por HTTP, contra IA.Api.
      IA__Modo: Remoto
      IA__UrlBaseRemota: "http://ia-api:8080"
      # Claves que cifran la sesion del navegador: en un volumen, para que una pestania abierta
      # no pierda la sesion cada vez que el contenedor se recrea.
      ProteccionDatos__DirectorioClaves: /claves
    volumes:
      - claves-web:/claves
    ports:
      - "${PUERTO_WEB:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      catalogo-api:
        condition: service_healthy
      catalogo-soap:
        condition: service_healthy
      ia-api:
        condition: service_healthy
    networks: [repmatch]

  # --- Perfiles opcionales -------------------------------------------------------------

  # La misma imagen de la Web, pero resolviendo el catalogo en proceso. Sirve para comparar
  # los dos modos dentro de contenedores durante la defensa.
  web-local:
    profiles: [local]
    image: repmatch/web:tp-inicial
    build:
      context: .
      dockerfile: src/RepMatch.Web/Dockerfile
    container_name: repmatch-web-local
    environment:
      <<: [*conexion-postgres, *llm, *tiendas]
      ASPNETCORE_ENVIRONMENT: Development
      Catalogo__Modo: Local
      IA__Modo: Local
      ProteccionDatos__DirectorioClaves: /claves
    volumes:
      - claves-web-local:/claves
    ports:
      - "${PUERTO_WEB_LOCAL:-8090}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [repmatch]

  # Simulador de tiendas VTEX con busquedas reales grabadas (tests/fixtures/vtex). Solo lo usan
  # las pruebas de punta a punta: scripts/e2e.sh apunta la Web aca y lo frena en la fase
  # SinTiendas para probar que la busqueda sigue andando sin precios.
  tienda-simulada:
    profiles: [simulacion]
    build:
      context: .
      dockerfile: tests/RepMatch.TiendaSimulada/Dockerfile
    image: repmatch/tienda-simulada:segunda
    container_name: repmatch-tienda-simulada
    networks: [repmatch]

  # Corre las pruebas sin necesidad de tener el SDK de .NET instalado.
  # No depende de postgres: usan el proveedor InMemory.
  tests:
    profiles: [test]
    build:
      context: .
      dockerfile: tests/RepMatch.Tests/Dockerfile
    image: repmatch/tests:tp-inicial
    networks: [repmatch]

  # Pruebas de punta a punta con Playwright, contra web (Remoto) y web-local (Local) por la red
  # de compose. Las orquesta scripts/e2e.sh, que ademas frena ia-api o catalogo-api para las
  # pruebas de resiliencia. Las capturas y trazas quedan en tests/RepMatch.E2E/resultados.
  e2e:
    profiles: [e2e]
    build:
      context: .
      dockerfile: tests/RepMatch.E2E/Dockerfile
    image: repmatch/e2e:segunda
    environment:
      E2E_URL_WEB: "http://web:8080"
      E2E_URL_WEB_LOCAL: "http://web-local:8080"
      E2E_URL_CATALOGO_SOAP: "http://catalogo-soap:8080"
      E2E_ESCENARIO: "${E2E_ESCENARIO:-Normal}"
    volumes:
      - ./tests/RepMatch.E2E/resultados:/resultados
    networks: [repmatch]

volumes:
  datos-postgres:
  claves-web:
  claves-web-local:

networks:
  repmatch:
    driver: bridge
