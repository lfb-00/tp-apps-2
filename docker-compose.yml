# Entorno de laboratorio de RepMatch — TP Inicial.
#
# Levanta los tres nodos del diagrama de despliegue: la base de datos, el host remoto del
# componente de catalogo y la aplicacion web. La Web arranca en modo Remoto para que el
# ejercicio de acceso remoto entre componentes quede demostrado apenas se levanta el entorno.
#
#   docker compose up --build --wait     -> espera a que todos esten sanos
#     Web       http://localhost:8080
#     Catalogo  http://localhost:8081/salud
#     IA        http://localhost:8083/salud   (Segunda Parte: diagnostico por texto libre)
#
#   docker compose --profile test run --rm tests        -> corre las pruebas
#   docker compose --profile local up --build web-local -> la misma Web en modo Local
#
# Los puertos del host se pueden cambiar con un archivo .env (ver .env.example) para
# evitar choques con lo que cada uno tenga corriendo.

x-conexion-postgres: &conexion-postgres
  Persistencia__Proveedor: Postgres
  ConnectionStrings__RepMatch: "Host=postgres;Port=5432;Database=repmatch;Username=repmatch;Password=repmatch"

# Proveedor del LLM. La clave sale del .env (que no se commitea); sin clave, cada servicio que
# diagnostica usa el clasificador local y el entorno levanta igual.
x-llm: &llm
  IA__Llm__ApiKey: "${IA_LLM_APIKEY:-}"
  IA__Llm__UrlBase: "${IA_LLM_URLBASE:-https://api.groq.com/openai/v1/}"
  IA__Llm__Modelo: "${IA_LLM_MODELO:-llama-3.3-70b-versatile}"

services:
  postgres:
    image: postgres:17-alpine
    container_name: repmatch-postgres
    environment:
      POSTGRES_DB: repmatch
      POSTGRES_USER: repmatch
      POSTGRES_PASSWORD: repmatch
    ports:
      - "${PUERTO_POSTGRES:-5432}:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      # Los servicios .NET esperan a que la base acepte conexiones de verdad,
      # no solo a que el contenedor exista.
      test: ["CMD-SHELL", "pg_isready -U repmatch -d repmatch"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [repmatch]

  catalogo-api:
    build:
      context: .
      dockerfile: src/RepMatch.Catalogo.Api/Dockerfile
    image: repmatch/catalogo-api:tp-inicial
    container_name: repmatch-catalogo-api
    environment:
      <<: [*conexion-postgres, *llm]
      # Development habilita /openapi/v1.json, que es parte del entregable.
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "${PUERTO_CATALOGO:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [repmatch]

  # Componente de IA expuesto por REST. No tiene base: recibe los candidatos en la peticion.
  ia-api:
    build:
      context: .
      dockerfile: src/RepMatch.IA.Api/Dockerfile
    image: repmatch/ia-api:segunda
    container_name: repmatch-ia-api
    environment:
      <<: *llm
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "${PUERTO_IA:-8083}:8080"
    networks: [repmatch]

  web:
    build:
      context: .
      dockerfile: src/RepMatch.Web/Dockerfile
    image: repmatch/web:tp-inicial
    container_name: repmatch-web
    environment:
      <<: *conexion-postgres
      ASPNETCORE_ENVIRONMENT: Development
      # Acceso REMOTO al componente de catalogo: resuelve por HTTP contra el otro contenedor.
      Catalogo__Modo: Remoto
      Catalogo__UrlBaseRemota: "http://catalogo-api:8080"
      # La IA tambien por HTTP, contra IA.Api.
      IA__Modo: Remoto
      IA__UrlBaseRemota: "http://ia-api:8080"
      # Claves que cifran la sesion del navegador: en un volumen, para que una pestania abierta
      # no pierda la sesion cada vez que el contenedor se recrea.
      ProteccionDatos__DirectorioClaves: /claves
    volumes:
      - claves-web:/claves
    ports:
      - "${PUERTO_WEB:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      catalogo-api:
        condition: service_healthy
      ia-api:
        condition: service_healthy
    networks: [repmatch]

  # --- Perfiles opcionales -------------------------------------------------------------

  # La misma imagen de la Web, pero resolviendo el catalogo en proceso. Sirve para comparar
  # los dos modos dentro de contenedores durante la defensa.
  web-local:
    profiles: [local]
    image: repmatch/web:tp-inicial
    build:
      context: .
      dockerfile: src/RepMatch.Web/Dockerfile
    container_name: repmatch-web-local
    environment:
      <<: [*conexion-postgres, *llm]
      ASPNETCORE_ENVIRONMENT: Development
      Catalogo__Modo: Local
      IA__Modo: Local
      ProteccionDatos__DirectorioClaves: /claves
    volumes:
      - claves-web-local:/claves
    ports:
      - "${PUERTO_WEB_LOCAL:-8090}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [repmatch]

  # Corre las pruebas sin necesidad de tener el SDK de .NET instalado.
  # No depende de postgres: usan el proveedor InMemory.
  tests:
    profiles: [test]
    build:
      context: .
      dockerfile: tests/RepMatch.Tests/Dockerfile
    image: repmatch/tests:tp-inicial
    networks: [repmatch]

  # Pruebas de punta a punta con Playwright, contra web (Remoto) y web-local (Local) por la red
  # de compose. Las orquesta scripts/e2e.sh, que ademas frena ia-api o catalogo-api para las
  # pruebas de resiliencia. Las capturas y trazas quedan en tests/RepMatch.E2E/resultados.
  e2e:
    profiles: [e2e]
    build:
      context: .
      dockerfile: tests/RepMatch.E2E/Dockerfile
    image: repmatch/e2e:segunda
    environment:
      E2E_URL_WEB: "http://web:8080"
      E2E_URL_WEB_LOCAL: "http://web-local:8080"
      E2E_ESCENARIO: "${E2E_ESCENARIO:-Normal}"
    volumes:
      - ./tests/RepMatch.E2E/resultados:/resultados
    networks: [repmatch]

volumes:
  datos-postgres:
  claves-web:
  claves-web-local:

networks:
  repmatch:
    driver: bridge
